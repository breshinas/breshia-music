:root{--bg:#0B0B0D;--surface:#151517;--surface-2:#1B1B1E;--ink:#F1F2F4;--muted:#8E9299;

<div class="wrap">

      <p class="eyebrow">I Am Not Leaving · 2014</p>

      <p class="sub">3:58</p>
      <div class="acts"><a class="pill solid" href="https://breshia-music.ru/?t=left"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg> Слушать</a><button class="pill" id="sh" type="button">Поделиться</button></div>
      <div class="plats"></div>
    </div>
  </div>
</div>
<script>(function(){
  /* Кнопка «Поделиться»: нативный share, иначе копируем адрес страницы.
     Поля со ссылкой на странице больше нет — адрес берём из location. */
  function copy(v,b){
    function done(){ if(!b) return; if(!b.getAttribute('data-orig')) b.setAttribute('data-orig',b.textContent.trim());
      b.classList.add('done'); b.textContent='Скопировано';
      clearTimeout(b._t); b._t=setTimeout(function(){ b.classList.remove('done'); b.textContent=b.getAttribute('data-orig'); },1900); }
    function fb(){ try{ var t=document.createElement('textarea'); t.value=v; t.setAttribute('readonly','');
      t.style.position='fixed'; t.style.top='-1000px'; document.body.appendChild(t); t.select();
      document.execCommand('copy'); document.body.removeChild(t); }catch(e){} }
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done,function(){fb();done();}); } else { fb(); done(); } }catch(e){ fb(); done(); }
  }
  var el=document.getElementById('cp'), lnk=document.getElementById('lnk');
  if(el && lnk) el.addEventListener('click',function(){ copy(lnk.value, el); });
  var sb=document.getElementById('sh');
  if(sb) sb.addEventListener('click',function(){
    var u=(lnk&&lnk.value)||location.href, t=document.title;
    try{ if(navigator.share){ navigator.share({title:t,url:u}).catch(function(){}); return; } }catch(e){}
    copy(u, sb);
  });
})();
</script>
